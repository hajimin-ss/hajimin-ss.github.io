<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://github.com">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">HN<span>.</span></a>
      <nav aria-label="主导航">
        <a href="{{ '/#writing' | relative_url }}">文章</a>
        <a href="{{ '/#about' | relative_url }}">关于</a>
        <a href="https://github.com/hajimin-ss" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </header>

    {{ content }}

    <footer>
      <span>© {{ site.time | date: '%Y' }} Hajimin</span>
      <span>Built with GitHub Pages</span>
    </footer>
  </body>
</html>
