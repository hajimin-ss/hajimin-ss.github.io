<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>我偏爱小而完整的系统 | Hajimin's Notes</title><link rel="stylesheet" href="../styles.css"></head><body><header class="site-header"><a class="brand" href="../index.html">HN<span>.</span></a><nav><a href="../index.html#writing">文章</a><a href="https://github.com/hajimin-ss">GitHub</a></nav></header><main class="post"><p class="eyebrow">工程 / 2026.08.12</p><h1>我偏爱小而完整的系统</h1><p class="lede">可理解性不是规模的反面，而是系统质量的一部分。</p><hr><p>小系统的魅力，在于它的每个边界都摸得着。你能知道一次请求从哪里进来、经过哪些判断、在什么地方离开。</p><p>这并不意味着拒绝增长。它只是提醒我们，把增长拆成依然能被理解的小块，而不是把复杂性藏进一个宏大的名词里。</p><p><a class="text-link" href="../index.html#writing">&larr; 返回文章列表</a></p></main><footer><span>© 2026 Hajimin</span><span>Built with GitHub Pages</span></footer></body></html>
