<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>好的笔记，需要一点形状 | Hajimin's Notes</title><link rel="stylesheet" href="../styles.css"></head><body><header class="site-header"><a class="brand" href="../index.html">HN<span>.</span></a><nav><a href="../index.html#writing">文章</a><a href="https://github.com/hajimin-ss">GitHub</a></nav></header><main class="post"><p class="eyebrow">思考 / 2026.08.20</p><h1>好的笔记，需要一点形状</h1><p class="lede">笔记不是答案的仓库，而是让问题继续生长的容器。</p><hr><p>记录的价值并不取决于它是否完整。一个片段、一处引用、一次判断失误，都值得留住。但它们需要被放到某个上下文里。</p><p>标题是最小的秩序。它迫使我们为眼前的想法暂定一个边界，也让未来的自己知道为什么要再打开它。</p><p><a class="text-link" href="../index.html#writing">&larr; 返回文章列表</a></p></main><footer><span>© 2026 Hajimin</span><span>Built with GitHub Pages</span></footer></body></html>
