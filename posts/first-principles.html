<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>从第一性原理开始设计一个服务 | Hajimin's Notes</title><link rel="stylesheet" href="../styles.css"></head><body><header class="site-header"><a class="brand" href="../index.html">HN<span>.</span></a><nav><a href="../index.html#writing">文章</a><a href="https://github.com/hajimin-ss">GitHub</a></nav></header><main class="post"><p class="eyebrow">工程 / 2026.08.28</p><h1>从第一性原理开始设计一个服务</h1><p class="lede">技术选型之前，先把问题的边界、输入和失败方式说清楚。</p><hr><p>一个服务的复杂度，很少来自某一行代码。更常见的来源是没有被写下的假设：谁会调用它、什么数据可以相信、发生故障后谁来负责。</p><p>先为这些问题给出朴素的答案，再选择数据库、消息队列或框架。设计会因此少一些漂亮的名词，多一些可验证的约束。</p><p><a class="text-link" href="../index.html#writing">&larr; 返回文章列表</a></p></main><footer><span>© 2026 Hajimin</span><span>Built with GitHub Pages</span></footer></body></html>
